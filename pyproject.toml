[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifold"
version = "0.1.0"
description = "Read Uniface repository exports as human-readable, diffable source."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
unifold = "unifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
