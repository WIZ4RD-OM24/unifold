[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifold"
# Single source of truth: src/unifold/__init__.py
dynamic = ["version"]
description = "Read Uniface repository exports as human-readable, diffable source."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["uniface", "procscript", "legacy", "version-control", "4gl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Pre-processors",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WIZ4RD-OM24/unifold"
Issues = "https://github.com/WIZ4RD-OM24/unifold/issues"

[project.scripts]
unifold = "unifold.cli:main"

[tool.setuptools.dynamic]
version = { attr = "unifold.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
