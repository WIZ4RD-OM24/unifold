name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, on both the platform Uniface developers
        # actually use and one Linux runner to catch path assumptions.
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch real export samples
        # Tests that need these skip cleanly when absent, so a network failure
        # must not fail the build -- it just narrows coverage.
        continue-on-error: true
        run: python scripts/fetch_samples.py

      - name: Report whether real samples are present
        shell: bash
        run: |
          if [ -d samples/learn-palettes ]; then
            echo "Real exports present -- full coverage."
            ls -1 samples/learn-palettes
          else
            echo "::warning::Real exports unavailable; sample-backed tests will skip."
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the package installs and the entry point works
        run: |
          python -m pip install --quiet .
          unifold --version
          unifold --help
